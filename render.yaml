services:
  - type: web
    name: katika-bet
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: VITE_PRIVY_APP_ID
        sync: false
